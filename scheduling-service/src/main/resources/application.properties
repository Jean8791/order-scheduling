server.port=8082
spring.application.name=scheduling-service

### MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/scheduling}
spring.data.mongodb.auto-index-creation=false

### RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

### Scheduling
scheduling.search-days=7
scheduling.zone=America/Sao_Paulo

### JWT
jwt.issuer=auth-service
jwt.public-key=classpath:jwt/public.pem

### Actuator
management.endpoints.web.exposure.include=health,info

### Swagger
springdoc.swagger-ui.path=/swagger-ui.html
