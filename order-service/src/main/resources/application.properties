server.port=${PORT:8081}
# Atrás do proxy do Render, usa os headers X-Forwarded-* para montar URLs com https.
server.forward-headers-strategy=framework
spring.application.name=order-service

### MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/orders}
# Os índices não são criados automaticamente a partir das anotações das entidades.
spring.data.mongodb.auto-index-creation=false

### RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
# Mensagem que falhar em todas as tentativas vai para a DLQ em vez de voltar
# para a fila (o que a faria ser reprocessada para sempre).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Até 3 tentativas por mensagem, esperando 1s e depois 2s entre elas.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

### Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

### JWT
jwt.issuer=auth-service
jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/public.pem}

### Actuator
management.endpoints.web.exposure.include=health,info

### Swagger
springdoc.swagger-ui.path=/swagger-ui.html
