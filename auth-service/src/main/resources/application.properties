server.port=${PORT:8083}
# Atrás do proxy do Render, usa os headers X-Forwarded-* para montar URLs com https.
server.forward-headers-strategy=framework
spring.application.name=auth-service

### MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/auth}
# Os índices não são criados automaticamente a partir das anotações das entidades.
spring.data.mongodb.auto-index-creation=false

### Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

### JWT
jwt.issuer=auth-service
jwt.expiration=6h
jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:classpath:jwt/private.pem}
jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/public.pem}

### Actuator
management.endpoints.web.exposure.include=health,info

### Swagger
springdoc.swagger-ui.path=/swagger-ui.html
